version: "3.9"

services:
  # 🗄️ PostgreSQL - Data Warehouse
  warehouse:
    image: postgres:15
    container_name: warehouse
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse123
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    networks:
      - datalake
      - drimsoft-network  # 🔥 Red compartida con frontend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 🐍 Flask API - Backend (puerto 5000)
  flask-api:
    build: ./dashboard
    container_name: flask-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: warehouse
      DB_PORT: 5432
      DB_NAME: warehouse
      DB_USER: warehouse
      DB_PASSWORD: warehouse123
    networks:
      - datalake
      - drimsoft-network  # 🔥 Red compartida con frontend
    depends_on:
      warehouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🔄 ETL - Extracción de datos
  etl:
    build: ./etl
    container_name: etl
    env_file:
      - .env
    environment:
      DB_HOST: warehouse
      DB_PORT: 5432
      DB_NAME: warehouse
      DB_USER: warehouse
      DB_PASSWORD: warehouse123
    networks:
      - datalake
    depends_on:
      warehouse:
        condition: service_healthy
    profiles:
      - etl

  # 📊 Dashboard - Aplicación Web (puerto 5005)
  dashboard:
    build: ./dashboard
    container_name: dashboard
    restart: always
    ports:
      - "5005:5000"
    environment:
      DB_HOST: warehouse
      DB_PORT: 5432
      DB_NAME: warehouse
      DB_USER: warehouse
      DB_PASSWORD: warehouse123
    networks:
      - datalake
    depends_on:
      warehouse:
        condition: service_healthy
      flask-api:
        condition: service_healthy

  # 🔧 pgAdmin - Administración
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - datalake
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  warehouse_data:
  pgadmin_data:

networks:
  datalake:
    driver: bridge
  
  # 🌐 Red externa compartida con el frontend
  drimsoft-network:
    external: true
    name: drimsoft-network