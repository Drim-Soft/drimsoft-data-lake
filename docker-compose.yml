services:
  # 🪣 Almacenamiento (Data Lake)
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Consola Web
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ⚙️ Ingesta (ETL visual)
  nifi:
    image: apache/nifi:1.25.0
    container_name: nifi
    hostname: nifi
    ports:
      - "8080:8080"   # HTTP
      - "8443:8443"   # HTTPS
    environment:
      # Configuración de red
      NIFI_WEB_HTTP_PORT: '8080'
      NIFI_WEB_HTTP_HOST: '0.0.0.0'
      NIFI_WEB_HTTPS_PORT: ''  # Deshabilitar HTTPS
      
      # 🔐 Credenciales personalizadas
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: admin123
      
      # Optimización de memoria
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    volumes:
      - nifi_database_repository:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_logs:/opt/nifi/nifi-current/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/nifi"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    restart: unless-stopped
    depends_on:
      - minio

  # 🧮 Motor SQL sobre Data Lake
  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8081:8080"
    environment:
      # Sin autenticación por defecto, se puede configurar
      TRINO_ENVIRONMENT: production
    volumes:
      - ./trino-config:/etc/trino
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      - minio

  # 🗄️ Base de datos para Superset
  postgres:
    image: postgres:15
    container_name: superset_db
    ports:
      - "5432:5432"
    environment:
      # 🔐 Credenciales de PostgreSQL
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset123
      POSTGRES_DB: superset
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 📊 Visualización y BI
  superset:
    image: apache/superset:latest
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      # 🔐 Credenciales de Superset
      SUPERSET_SECRET_KEY: 'drimsoft'
      
      # Conexión a PostgreSQL
      DATABASE_DIALECT: postgresql
      DATABASE_USER: superset
      DATABASE_PASSWORD: superset123
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_DB: superset
      
      # No cargar ejemplos
      SUPERSET_LOAD_EXAMPLES: 'no'
    command: >
      bash -c "
      superset db upgrade &&
      superset fab create-admin 
        --username admin 
        --firstname Admin 
        --lastname User 
        --email admin@drimsoft.com 
        --password admin123456 &&
      superset init &&
      gunicorn 
        --bind 0.0.0.0:8088 
        --access-logfile - 
        --error-logfile - 
        --workers 4 
        --worker-class gthread 
        --threads 20 
        --timeout 200 
        --limit-request-line 0 
        --limit-request-field_size 0 
        'superset.app:create_app()'
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./superset_home:/app/superset_home

volumes:
  nifi_database_repository:
  nifi_flowfile_repository:
  nifi_content_repository:
  nifi_provenance_repository:
  nifi_state:
  nifi_logs: