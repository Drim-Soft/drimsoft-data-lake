services:
  # 🧭 Prefect - Orquestador ETL
  prefect:
    image: prefecthq/prefect:2.19.4-python3.10
    container_name: prefect
    restart: always
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      PREFECT_API_URL: "http://0.0.0.0:4200/api"
    command: prefect server start --host 0.0.0.0
    networks:
      - datalake

  # 🗄️ PostgreSQL - Data Warehouse
  warehouse:
    image: postgres:15
    container_name: warehouse
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse123
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    networks:
      - datalake
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 🗄️ PostgreSQL - Base de datos de Superset
  superset-db:
    image: postgres:15
    container_name: superset-db
    restart: always
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset_db:/var/lib/postgresql/data
    networks:
      - datalake
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 🔴 Redis - Caché de Superset
  redis:
    image: redis:7
    container_name: redis
    restart: always
    networks:
      - datalake
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 📊 Superset - Dashboards
  superset:
    image: apache/superset:latest
    container_name: superset
    restart: always
    environment:
      SUPERSET_SECRET_KEY: supersecretkey123456789abcdefgh
      DATABASE_DIALECT: postgresql
      DATABASE_USER: superset
      DATABASE_PASSWORD: superset
      DATABASE_HOST: superset-db
      DATABASE_PORT: 5432
      DATABASE_DB: superset
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8088:8088"
    depends_on:
      superset-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - superset_home:/app/superset_home
    networks:
      - datalake
    command:
      - /bin/bash
      - -c
      - |
        pip install psycopg2-binary redis
        superset db upgrade
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin123 || true
        superset init
        gunicorn --bind 0.0.0.0:8088 --workers 4 --timeout 120 --limit-request-line 0 --limit-request-field_size 0 'superset.app:create_app()'

volumes:
  warehouse_data:
  superset_db:
  superset_home:

networks:
  datalake:
    driver: bridge