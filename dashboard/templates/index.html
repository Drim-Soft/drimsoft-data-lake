<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drimsoft Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 40px; }
        header h1 { font-size: 3rem; text-shadow: 3px 3px 6px rgba(0,0,0,0.3); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-8px); }
        .stat-card h3 {
            color: #667eea;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .stat-card .value {
            font-size: 2.8rem;
            font-weight: 800;
            color: #333;
        }
        .stat-card.money .value { color: #10b981; }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(550px, 1fr));
            gap: 25px;
        }
        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .chart-container { width: 100%; height: 420px; }
        .loading {
            text-align: center;
            color: white;
            font-size: 2rem;
            padding: 80px;
        }
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: white;
            color: #667eea;
            border: none;
            padding: 18px 35px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }
        .refresh-btn:hover {
            transform: scale(1.08);
            background: #667eea;
            color: white;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Drimsoft Dashboard</h1>
            <p>Data Lake en Tiempo Real</p>
        </header>

        <div class="loading" id="loading">Cargando datos...</div>

        <div id="content" class="hidden">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>👥 Usuarios Planifika</h3>
                    <div class="value" id="stat-users-planifika">0</div>
                </div>
                <div class="stat-card">
                    <h3>👨‍💼 Usuarios Drimsoft</h3>
                    <div class="value" id="stat-users-drimsoft">0</div>
                </div>
                <div class="stat-card">
                    <h3>📁 Proyectos</h3>
                    <div class="value" id="stat-projects">0</div>
                </div>
                <div class="stat-card">
                    <h3>✅ Tareas</h3>
                    <div class="value" id="stat-tasks">0</div>
                </div>
                <div class="stat-card">
                    <h3>🎫 Tickets</h3>
                    <div class="value" id="stat-tickets">0</div>
                </div>
                <div class="stat-card">
                    <h3>📋 Suscripciones</h3>
                    <div class="value" id="stat-subscriptions">0</div>
                </div>
                <div class="stat-card money">
                    <h3>💰 Ingresos</h3>
                    <div class="value" id="stat-revenue">$0</div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card"><div id="chart-projects" class="chart-container"></div></div>
                <div class="chart-card"><div id="chart-tasks" class="chart-container"></div></div>
                <div class="chart-card"><div id="chart-tickets" class="chart-container"></div></div>
                <div class="chart-card"><div id="chart-methodology" class="chart-container"></div></div>
                <div class="chart-card"><div id="chart-subscriptions" class="chart-container"></div></div>
                <div class="chart-card"><div id="chart-revenue" class="chart-container"></div></div>
            </div>
        </div>

        <button class="refresh-btn" onclick="loadAllData()">🔄</button>
    </div>

    <script>
        async function fetchData(endpoint) {
            const response = await fetch(`/api/${endpoint}`);
            return await response.json();
        }

        async function loadStats() {
            const stats = await fetchData('stats');
            document.getElementById('stat-users-planifika').textContent = stats.total_users_planifika || 0;
            document.getElementById('stat-users-drimsoft').textContent = stats.total_users_drimsoft || 0;
            document.getElementById('stat-projects').textContent = stats.total_projects || 0;
            document.getElementById('stat-tasks').textContent = stats.total_tasks || 0;
            document.getElementById('stat-tickets').textContent = stats.total_tickets || 0;
            document.getElementById('stat-subscriptions').textContent = stats.total_subscriptions || 0;
            document.getElementById('stat-revenue').textContent = 
    '$' + (stats.total_revenue || 0).toLocaleString('es-CO');
        }

        async function loadChart(endpoint, elementId) {
            const data = await fetchData(`charts/${endpoint}`);
            if (data && data.data) {
                Plotly.newPlot(elementId, data.data, data.layout, {responsive: true, displayModeBar: false});
            }
        }

        async function loadAllData() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('content').classList.add('hidden');

            await loadStats();
            await loadChart('projects-status', 'chart-projects');
            await loadChart('tasks-status', 'chart-tasks');
            await loadChart('tickets-status', 'chart-tickets');
            await loadChart('methodology-distribution', 'chart-methodology');
            await loadChart('subscriptions-status', 'chart-subscriptions');
            await loadChart('revenue-timeline', 'chart-revenue');

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', loadAllData);
        setInterval(loadAllData, 300000);
    </script>
</body>
</html>
